name: Run Python in Environment

on: [push]

jobs:
  run-python:
    runs-on: ubuntu-latest
    environment: python-env   # name of your environment
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Run Python code
        run: python code.py
